  .sub { font: 500 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#cbd5e1; opacity:0; animation: rise 1.2s .7s ease-out forwards; }
  .tag { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill:#7dd3fc; opacity:0; animation: rise 1.2s 1.2s ease-out forwards; letter-spacing:.6px; }
  .hi { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill:#38bdf8; opacity:0; animation: rise 1s 0s ease-out forwards; }
  @keyframes draw { 0% {stroke-dashoffset:1400} 35% {stroke-dashoffset:0} 90% {stroke-dashoffset:0; opacity:1} 100% {stroke-dashoffset:0; opacity:0} }
  @keyframes show { 0%,36% {opacity:0} 44%,88% {opacity:1} 100% {opacity:0} }
  @keyframes dot { 0%,34% {opacity:0} 37%,88% {opacity:1} 100% {opacity:0} }
  @keyframes band { 0%,38% {opacity:0; transform:scaleY(.05)} 55% {opacity:.18; transform:scaleY(1)} 88% {opacity:.18; transform:scaleY(1)} 100% {opacity:0; transform:scaleY(1)} }
  @keyframes band50 { 0%,40% {opacity:0; transform:scaleY(.05)} 58% {opacity:.28; transform:scaleY(1)} 88% {opacity:.28; transform:scaleY(1)} 100% {opacity:0; transform:scaleY(1)} }
  @keyframes rise { from {opacity:0; transform:translateY(12px)} to {opacity:1; transform:translateY(0)} }
  @keyframes float { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-10px)} }
  @media (prefers-reduced-motion: reduce) {
    .hist { animation:none; stroke-dashoffset:0 } .fc,.now,.lbl,.dot { animation:none; opacity:1 }
    .band { animation:none; opacity:.18 } .band50 { animation:none; opacity:.28 } .sym { animation:none }
  }
</style>
