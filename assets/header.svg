  .now { stroke:#94a3b8; stroke-width:1; stroke-dasharray:3 4; opacity:0; animation: show 9s ease-in-out infinite; }
  .dot { fill:#38bdf8; opacity:0; animation: dot 9s ease-in-out infinite; }
  .lbl { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill:#a5b4fc; opacity:0; animation: show 9s ease-in-out infinite; letter-spacing:.5px; }
