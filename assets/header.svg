          stroke-dasharray:1400; stroke-dashoffset:1400; animation: draw 9s ease-in-out infinite; }
  .fc { fill:none; stroke:#c4b5fd; stroke-width:2.2; stroke-dasharray:7 6; opacity:0; animation: show 9s ease-in-out infinite; }
