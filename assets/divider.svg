<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24" role="img" aria-label="divider">
<title>divider</title>
<defs>
  <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset=".2" stop-color="#38bdf8" stop-opacity=".6"/><stop offset=".8" stop-color="#a78bfa" stop-opacity=".6"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
  <radialGradient id="p"><stop offset="0" stop-color="#e0f2fe"/><stop offset=".4" stop-color="#7dd3fc" stop-opacity=".8"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .pulse { animation: run 4.5s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes run { from { transform:translateX(40px) } to { transform:translateX(860px) } }
  .d { animation: tw 3s ease-in-out infinite }
  @keyframes tw { 0%,100% { opacity:.25 } 50% { opacity:.9 } }
  @media (prefers-reduced-motion: reduce) { .pulse,.d { animation:none } }
</style>
<rect x="0" y="11" width="900" height="2" fill="url(#l)"/>
<circle class="d" cx="450" cy="12" r="3.5" fill="#a5b4fc"/><circle class="d" cx="430" cy="12" r="2" fill="#7dd3fc" style="animation-delay:-1s"/><circle class="d" cx="470" cy="12" r="2" fill="#c4b5fd" style="animation-delay:-2s"/>
<ellipse class="pulse" cx="0" cy="12" rx="38" ry="6" fill="url(#p)"/>
</svg>